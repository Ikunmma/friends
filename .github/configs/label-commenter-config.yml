# .github/configs/label-commenter-config.yml

labels:
  - name: '审核中'
    labeled:
      issue:
        body: |
          **感谢您的支持，接下来请完成任务或等待审核！**
          
          您已经完成了友链申请，由于博主设置了友链申请条件，接下来博主将会等待条件满足后完成审批。

          > 等待期间可以先去 [无言の小屋](https://hackun.top) 看看。
          
    unlabeled:
      issue:
        body: |
          **🎉 恭喜，友链添加成功！**

          自动任务完成后，刷新 [友链页面](https://hackun.top/friends/) 就可以看到您的链接和最新文章。

          > 如果您的站点信息发生了变动，请直接修改这个 issue 的内容。
  
  - name: '缺少文章'
    labeled:
      issue:
        body: |
          **🥹 很遗憾，部分条件未满足～**

          很感谢您的支持，但当前站点还缺少可供阅读的原创内容。

  - name: '未添加友链'
    labeled:
      issue:
        body: |
          **👋 请及时添加本站友链**

          距离成功只剩一步之遥了，请把本站添加到您的友链中，然后再下方评论告知。

  - name: '长期失联'
    labeled:
      issue:
        action: close
        body: |
          **⚠️ 抱歉，您的网站长期打不开，现已暂时下架。**

          如果您确认可以打开，请在下方评论告知，我们会在人工审核通过后恢复上架。
